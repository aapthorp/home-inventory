services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: home_inventory
      POSTGRES_USER: home_inventory
      POSTGRES_PASSWORD: home_inventory
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build: .
    depends_on:
      - db
      - minio
    environment:
      DB_URL: jdbc:postgresql://db:5432/home_inventory
      DB_USER: home_inventory
      DB_PASSWORD: home_inventory
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      QUARKUS_PROFILE: prod
    ports:
      - "8080:8080"

volumes:
  db-data:
  minio-data:
