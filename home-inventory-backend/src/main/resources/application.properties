# --- Datasource ---
# Points at a Postgres instance you run yourself (local install or docker-compose).
# Dev Services is explicitly disabled below so `mvn quarkus:dev` uses this instead
# of spinning up its own throwaway container.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${DB_USER:home_inventory}
quarkus.datasource.password=${DB_PASSWORD:home_inventory}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/home_inventory}

quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.flyway.migrate-at-start=true

# --- HTTP / CORS (mobile app runs on a different origin during dev) ---
# quarkus.http.host defaults to "localhost" in dev mode specifically (0.0.0.0 in
# prod) — override it so your phone/emulator on the LAN can reach this at all.
quarkus.http.host=0.0.0.0
# Set both property names — the CORS enable flag was renamed between Quarkus
# versions (quarkus.http.cors -> quarkus.http.cors.enabled), and an unrecognized
# key is silently ignored rather than erroring, so the filter can end up simply
# never activating. Setting both is a harmless no-op for whichever one is stale.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
# Explicit rather than relying on defaults — X-Household-Id is a custom header,
# so the browser's CORS preflight (OPTIONS) needs it explicitly allow-listed or
# the browser blocks the response even though the server itself returns 200.
quarkus.http.cors.headers=accept,authorization,content-type,x-household-id
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.port=8080

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true

# --- Object storage (MinIO) ---
# --- Object storage (MinIO) ---
# quarkus.minio.url is deprecated in newer extension versions in favor of
# host/port/secure — and critically, Dev Services auto-launches its own
# throwaway MinIO container (random port, random credentials) if it doesn't
# recognize the host as explicitly configured. Using .url silently triggered
# that, which is why uploads failed with "Access Key Id does not exist" even
# though minioadmin/minioadmin was set — it was talking to the wrong container.
quarkus.minio.devservices.enabled=false
quarkus.minio.host=${MINIO_HOST:localhost}
quarkus.minio.port=${MINIO_PORT:9000}
quarkus.minio.secure=false
quarkus.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
quarkus.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
home-inventory.storage.bucket=item-attachments

# --- External barcode lookup ---
# Swap for your chosen provider (UPCitemdb, Barcode Lookup API, etc.)
barcode-api/mp-rest/url=${BARCODE_API_BASE_URL:https://api.upcitemdb.com/prod/trial}
