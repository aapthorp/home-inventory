# --- Datasource ---
# In dev mode Quarkus Dev Services spins up a throwaway Postgres automatically
# if these are left unset. For a real run (docker-compose), set explicitly:
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:home_inventory}
%prod.quarkus.datasource.password=${DB_PASSWORD:home_inventory}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/home_inventory}

quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true

# --- HTTP / CORS (mobile app runs on a different origin during dev) ---
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.port=8080

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true

# --- Object storage (MinIO) ---
quarkus.minio.url=${MINIO_URL:http://localhost:9000}
quarkus.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
quarkus.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
home-inventory.storage.bucket=item-attachments

# --- External barcode lookup ---
# Swap for your chosen provider (UPCitemdb, Barcode Lookup API, etc.)
barcode-api/mp-rest/url=${BARCODE_API_BASE_URL:https://api.upcitemdb.com/prod/trial}
